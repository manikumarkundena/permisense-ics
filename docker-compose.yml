services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: permisense
      POSTGRES_USER: permisense
      POSTGRES_PASSWORD: permisense
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permisense -d permisense"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - permisense_pgdata:/var/lib/postgresql/data

  permisense:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://permisense:permisense@postgres:5432/permisense
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      MODBUS_HOST: 127.0.0.1
      MODBUS_PORT: 5020
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  permisense_pgdata:
